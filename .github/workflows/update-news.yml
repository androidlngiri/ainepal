name: Update Sajilo AI Khabar

on:
  schedule:
    # Runs every 4 hours. GitHub Actions free tier gives 2,000 minutes/month
    # for private repos and unlimited for public repos -- this uses ~1-2
    # minutes per run, so a public repo costs $0.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and translate new articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_and_translate.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "sajilo-ai-khabar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json docs/index.html
          git diff --quiet --cached || git commit -m "Auto-update: news refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
